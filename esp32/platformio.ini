; ESP32 (M5Stack Atom Lite) test harness for the Open-Nuki-Fob protocol code.
; Builds the unchanged ../src protocol + ../external crypto against NimBLE.
[platformio]
src_dir = main

[env:atom-lite]
platform = espressif32 @ 6.9.0
board = m5stack-atom
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The CMake bundled with this platform is x86_64-only; 3.30 runs natively on Apple Silicon
platform_packages = platformio/tool-cmake @ 3.30.2
